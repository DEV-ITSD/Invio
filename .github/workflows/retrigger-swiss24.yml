name: Retrigger swiss.24 preparation

# Execute once for swiss.24.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/retrigger-swiss24.yml

permissions:
  contents: write
  actions: write

jobs:
  retrigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable manual dispatch and run preparation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/prepare-swiss24.yml')
          text = path.read_text(encoding='utf-8')
          if '  workflow_dispatch:\n' not in text:
              text = text.replace('on:\n  push:\n', 'on:\n  workflow_dispatch:\n  push:\n', 1)
              path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/prepare-swiss24.yml
          if ! git diff --cached --quiet; then
            git commit -m "Enable swiss.24 preparation dispatch"
            git push origin HEAD:main
          fi
          gh workflow run prepare-swiss24.yml --repo "${{ github.repository }}" --ref main
