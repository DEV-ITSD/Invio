name: Report swiss.24 preparation

on:
  workflow_run:
    workflows:
      - Prepare swiss.24 invoice title
    types:
      - completed

permissions:
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Report preparation result
        env:
          GH_TOKEN: ${{ github.token }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh pr comment 31 --repo "${{ github.repository }}" --body "swiss.24 preparation: **${CONCLUSION}** · run ${RUN_ID} · ${{ github.server_url }}/${{ github.repository }}/actions/runs/${RUN_ID}"
