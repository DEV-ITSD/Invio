name: Run swiss.25 from PR comment

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    if: github.event.issue.pull_request && github.event.comment.body == 'run-swiss25'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply swiss.25 patch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B agent/swiss-25-title-visibility
          python scripts/prepare_swiss25.py

      - name: Validate source patch
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'invoice.title || "-"' 'frontend/src/routes/invoices/[id]/+page.svelte'
          grep -F 'handleSort("title")' 'frontend/src/routes/invoices/+page.svelte'
          grep -F '<th>{t("Title")}</th>' 'frontend/src/routes/dashboard/+page.svelte'
          grep -F 'title?: string;' 'frontend/src/routes/dashboard/+page.server.ts'
          grep -Fx '2.1.1-swiss.25' VERSION
          grep -Fx '2.1.1-swiss.25' frontend/static/VERSION
          git diff --check

      - name: Check frontend
        working-directory: frontend
        run: |
          npm install --package-lock=false
          npm run check

      - name: Commit swiss.25 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION frontend/static/VERSION \
            'frontend/src/routes/invoices/[id]/+page.svelte' \
            'frontend/src/routes/invoices/+page.svelte' \
            'frontend/src/routes/dashboard/+page.svelte' \
            'frontend/src/routes/dashboard/+page.server.ts'
          git commit -m "Show invoice title across invoice views (swiss.25)"
          git push --force origin HEAD:agent/swiss-25-title-visibility

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "✅ swiss.25 preparation succeeded · run ${{ github.run_id }}"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "❌ swiss.25 preparation failed · run ${{ github.run_id }}"
